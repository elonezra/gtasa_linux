name: Build PortMaster artifact

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the OCI artifact to GHCR (manual builds default to download only)
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      # This diagnostic branch must never publish an OCI image on push.
      PUBLISH_OCI: "${{ github.ref_name != 'recalbox-16k' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}"
      GAME: "${{ (github.ref_name == 'miami' || (github.event_name == 'release' && github.event.release.target_commitish == 'miami')) && 'gtavc' || 'gtasa' }}"
      LAUNCHER_SCRIPT: "${{ (github.ref_name == 'miami' || (github.event_name == 'release' && github.event.release.target_commitish == 'miami')) && 'Grand Theft Auto Vice City.sh' || 'Grand Theft Auto San Andreas.sh' }}"
      BINARY_NAME: "${{ (github.ref_name == 'miami' || (github.event_name == 'release' && github.event.release.target_commitish == 'miami')) && 'gtavc_linux' || 'gtasa_linux' }}"
      GAME_TITLE: "${{ (github.ref_name == 'miami' || (github.event_name == 'release' && github.event.release.target_commitish == 'miami')) && 'Grand Theft Auto: Vice City' || 'Grand Theft Auto: San Andreas' }}"
      CONFIG_NAME: "${{ (github.ref_name == 'miami' || (github.event_name == 'release' && github.event.release.target_commitish == 'miami')) && 'gtavc.cfg' || 'gtasa_nx.cfg' }}"
      APPSTATE_NAME: "${{ (github.ref_name == 'miami' || (github.event_name == 'release' && github.event.release.target_commitish == 'miami')) && 'gtavc-appstate.txt' || 'appstate.txt' }}"



    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test host-page loader with synthetic ELF only
        run: |
          set -eu
          getconf PAGESIZE
          cc -D_GNU_SOURCE -std=c11 -Wall -Wextra -Isource \
            tests/elf_pages_test.c source/so_util.c source/error_linux.c \
            -o "$RUNNER_TEMP/elf_pages_test"
          (cd "$RUNNER_TEMP" && ./elf_pages_test)

      - name: Upload standalone ARM64 synthetic loader test
        uses: actions/upload-artifact@v4
        with:
          name: elf-pages-test-arm64
          path: ${{ runner.temp }}/elf_pages_test
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH_OCI == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.GAME }}

      - name: Build flat PortMaster artifact (publish only when enabled)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: artifact
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          outputs: |
            ${{ env.PUBLISH_OCI == 'true' && 'type=registry' || '' }}
            type=local,dest=artifact/${{ env.GAME }}
          build-args: |
            GAME=${{ env.GAME }}
            LAUNCHER_SCRIPT=${{ env.LAUNCHER_SCRIPT }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            GAME_TITLE=${{ env.GAME_TITLE }}
            CONFIG_NAME=${{ env.CONFIG_NAME }}
            APPSTATE_NAME=${{ env.APPSTATE_NAME }}

          cache-from: type=gha,scope=${{ env.GAME }}
          cache-to: type=gha,mode=max,scope=${{ env.GAME }}

      - name: Upload flat PortMaster tree
        uses: actions/upload-artifact@v4
        with:
          name: gtasa-portmaster-${{ env.GAME }}
          path: artifact/${{ env.GAME }}
          if-no-files-found: error

      - name: Create and upload release tarball
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p release
          archive="release/gtasa-portmaster-${GAME}-${GITHUB_REF_NAME}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C "artifact/${GAME}" -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
          tar -tzf "$archive" >/dev/null
          gh release upload "${{ github.event.release.tag_name }}" \
            "$archive" "$archive.sha256" --clobber
