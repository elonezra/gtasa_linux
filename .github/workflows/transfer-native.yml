name: Transfer approved native diagnostics

on:
  push:
    branches: [recalbox-16k]
    paths: [.github/workflows/transfer-native.yml]

permissions:
  actions: read
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download approved native game build
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13743023355'
          path: incoming/game
          run-id: 42774300780
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download approved synthetic loader test
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13743286837'
          path: incoming/test
          run-id: 42774300780
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Prepare native-only transfer bundle
        shell: python
        run: |
          import base64, gzip, hashlib, io, json, tarfile
          from pathlib import Path
          entries = {
              'gtasa_linux': Path('incoming/game/gtasa/gtasa_linux'),
              'libs.aarch64/libSDL3.so.0': Path('incoming/game/gtasa/libs.aarch64/libSDL3.so.0'),
              'elf_pages_test': Path('incoming/test/elf_pages_test'),
          }
          files = {}
          buf = io.BytesIO()
          with tarfile.open(fileobj=buf, mode='w') as archive:
              for name, path in entries.items():
                  data = path.read_bytes()
                  files[name] = {'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
                  info = tarfile.TarInfo(name)
                  info.size, info.mode, info.mtime = len(data), 0o700, 0
                  archive.addfile(info, io.BytesIO(data))
          payload = gzip.compress(buf.getvalue(), compresslevel=9, mtime=0)
          out = Path('.native-transfer')
          out.mkdir()
          (out/'payload.b64').write_text(base64.b64encode(payload).decode('ascii'))
          (out/'manifest.json').write_text(json.dumps({
              'source_run': 42774300780,
              'source_commit': '097e9567a3377645db8289538b560f7cdeafdd00',
              'archive_sha256': hashlib.sha256(payload).hexdigest(),
              'files': files,
          }))
          print('Native bundle bytes:', len(payload))
          print('Native bundle SHA256:', hashlib.sha256(payload).hexdigest())

      # Text blobs allow the connected GitHub API to transfer build outputs to
      # the Pi without shell network access. No binary enters branch history.
      # Only the three source-built native outputs above are included.
      - name: Export native diagnostics through connected GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('.native-transfer/payload.b64', 'utf8');
            const manifest = JSON.parse(fs.readFileSync('.native-transfer/manifest.json', 'utf8'));
            manifest.chunks = [];
            for (let offset = 0; offset < text.length; offset += 49152) {
              const blob = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: text.slice(offset, offset + 49152),
                encoding: 'utf-8',
              });
              manifest.chunks.push(blob.data.sha);
            }
            const blob = await github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: JSON.stringify(manifest),
              encoding: 'utf-8',
            });
            core.info('NATIVE_TRANSFER_MANIFEST ' + blob.data.sha);
